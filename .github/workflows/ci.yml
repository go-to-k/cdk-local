name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run test
      - run: vp run test:hooks
      - run: vp run build

      # Issue #402 diagnostics: if a forks worker crashed ("Worker exited
      # unexpectedly"), Node's --report-on-fatalerror / --report-uncaught-exception
      # (armed in vite.config.ts) wrote a report.*.json with the native + JS
      # stack and open libuv handles. Dump any report to the log on failure so
      # the next crash pinpoints the offending native handle. No-op on success.
      - name: Dump Node diagnostic reports (on failure)
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in report.*.json; do
            found=1
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          [ "$found" = 0 ] && echo "No Node diagnostic report written (worker did not hit a fatal/uncaught crash)."
          exit 0

  runtime-compat:
    runs-on: ubuntu-latest
    needs: check-build-test
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp env exec --node ${{ matrix.node-version }} node dist/cli.js --version
