name: Release

on:
  push:
    branches:
      - main

# Serialize Release workflow runs so a back-to-back merge (#204 + #205
# landed within ~30s and the earlier run's `git push --tags HEAD:main`
# raced the later commit's fast-forward, exiting 1 with `! [rejected]
# (fetch first)`). Queue the runs instead — `cancel-in-progress: false`
# preserves every release, just runs them one at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1
        with:
          node-version: "24"
          cache: true
          run-install: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vp exec semantic-release
