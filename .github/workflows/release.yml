name: Release

# Batched releases via release-please (issue: release-per-merge cadence was too
# high). Every push to main creates/updates a single "chore(release): <ver>"
# release PR; merging THAT PR creates the tag + GitHub release and publishes to
# npm. Ordinary feat/fix merges no longer publish anything by themselves.
#
# v0 guard: cdk-local deliberately stays at major version 0. Two independent
# layers enforce it:
#   1. release-please-config.json sets bump-minor-pre-major: true, so a
#      breaking change bumps MINOR (0.x.0), never 1.0.0.
#   2. The publish job below hard-fails before npm publish if the computed
#      major is not 0 (covers a manual Release-As: 1.0.0 override too).
#
# npm auth is OIDC trusted publishing (id-token: write + registry-url), bound
# to THIS workflow filename on npmjs.com — do not rename release.yml without
# updating the trusted publisher config.
#
# Known behavior: the release PR is created with GITHUB_TOKEN, and GitHub does
# not trigger `pull_request` workflows for such PRs — so the release PR shows
# NO CI checks. Its diff is only version/CHANGELOG/manifest; the maintainer
# merges it via the web UI. To get CI on release PRs, hand the release-please
# step a PAT. (Unlike the sibling cdkd, this repo has no ci-green-gate hook,
# so nothing agent-side blocks on the missing checks either.)
#
# Known behavior 2 — a STANDING release PR goes STALE, and looks fine while it
# is: release-please does not rebuild a release PR whose computed release is
# unchanged. It logs `PR #N remained the same` and leaves the branch on the
# base it was cut from. So anything that lands on main afterwards in a file
# release-please OWNS (CHANGELOG.md, package.json's version,
# .release-please-manifest.json) is simply missing from that branch — and
# GitHub still reports the PR MERGEABLE, because a stale copy is not a
# conflict. Merging it then REVERTS that change. Measured in the sibling cdkd:
# release PR go-to-k/cdkd#2503 was cut before the CHANGELOG normalization
# merged, its branch still carried the pre-normalization file, and merging it
# would have undone 285 header conversions.
#
# Remedy: CLOSE the release PR, DELETE its branch, and re-run this workflow —
# release-please recomputes the identical release from current main. That is
# what the `workflow_dispatch` trigger below is for; without it the only way
# to re-run is `gh run rerun` on an old push run. It is safe to fire at any
# time because release-please is idempotent: with no new releasable commits it
# recreates the same release PR, and with none at all it does nothing.

on:
  push:
    branches:
      - main
  # Manual re-run, for the stale-standing-PR remedy above.
  workflow_dispatch:

# Serialize Release workflow runs so a back-to-back merge (#204 + #205
# landed within ~30s and the earlier run's `git push --tags HEAD:main`
# raced the later commit's fast-forward, exiting 1 with `! [rejected]
# (fetch first)`). Queue the runs instead — `cancel-in-progress: false`
# preserves every release, just runs them one at a time. Under
# release-please the race target is the standing release PR rather than a
# tag push, but two overlapping runs can still fight over updating it, so
# the queue stays.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Enforce v0 (never publish a v1+ release)
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          set -eu
          VERSION="${TAG_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_NAME)"
            exit 1
          fi
          if [ "$MAJOR" != "0" ]; then
            echo "::error::Refusing to publish $TAG_NAME: cdk-local is intentionally kept at major version 0 (bump-minor-pre-major). Delete the tag/release and fix the version source."
            exit 1
          fi
          case "$VERSION" in
            0.*) ;;
            *)
              echo "::error::Refusing to publish $TAG_NAME: version does not start with 0."
              exit 1
              ;;
          esac

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build

      - name: Publish to npm
        run: npm publish
