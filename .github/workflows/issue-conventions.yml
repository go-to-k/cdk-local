name: Issue conventions

# English-only on the surfaces a REPOSITORY FILE check cannot see: an issue
# body, an issue comment, and a PR's title and body.
#
#   scripts/check-gh-body-english.ts
#
# The retired `.claude/hooks/non-english-text-gate.sh` scanned the PR DIFF only,
# so none of these was checked by anything. They are published OSS artifacts
# exactly like a committed file (`.claude/AGENTS.md` -> Workflow rules ->
# English only says so in as many words), so this is NEW coverage rather than a
# port of something this repo had.
#
# ## THE TEXT IS NEVER INTERPOLATED INTO A SHELL COMMAND
#
# Following `.github/workflows/pr-inherit-issue-labels.yml`: an issue or PR body
# is attacker-controlled text, so it is fetched SERVER-SIDE with `gh ... --json`
# and handed to the checker as a JSON file. `${{ github.event.issue.body }}` is
# never written anywhere in this file. Only NUMBERS and the repository name
# cross into shell, through `env:`, quoted.
#
# ## `pull_request` vs `pull_request_target` — the security decision
#
# This uses `pull_request`, and the sibling `pr-inherit-issue-labels.yml` uses
# `pull_request_target`. They differ because their OUTPUTS differ, not by
# accident:
#
#   - that workflow WRITES (it adds labels to the PR). A fork PR's
#     `pull_request` token is read-only, so the write would silently no-op on
#     exactly the PRs a maintainer did not open. It needs
#     `pull_request_target`'s write token, and it is safe there only because it
#     executes nothing from the head.
#   - this job only has to say NO. A failing check run is its entire output, it
#     needs no write permission at all, and a `pull_request` check appears on
#     the PR and can be a required status check. `pull_request_target` would
#     hand a WRITE token and the base repo's secrets to a workflow whose whole
#     job is to refuse — strictly more privilege for strictly no capability.
#
# The residual `pull_request` normally carries is that on a fork PR the default
# checkout is the MERGE ref, so the PR could ship a modified copy of the very
# checker that judges it. That is closed by the checkout ref chosen in the
# `english-pr` job below, which picks base for a FORK and head for a same-repo
# branch. The PR body still comes from the API either way, and the PR's own
# version of `scripts/**` is covered by the unit suite in `ci.yml`.
#
# `synchronize` is in the PR trigger list even though a push cannot change a
# body or a title. Required status checks are evaluated against the HEAD SHA, so
# a check that does not re-run on a new commit leaves the PR waiting on a status
# that will never arrive. `pr-title-check.yml` carries the same four types for
# the same reason.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: issue-conventions-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id || 'x' }}
  cancel-in-progress: true

jobs:
  # --- English-only, on the ISSUE surfaces ----------------------------------
  # Split from the PR job below ONLY so the permission sets can differ: this one
  # posts a comment (an issue has no check-run surface a human will look at),
  # the PR one does not and stays read-only.
  english-issue:
    name: English-only (issue / comment)
    # The Bot exclusion is not tidiness. This job POSTS A COMMENT, and a comment
    # is itself an `issue_comment: created` event — so without it the job scans
    # its own output on every violation. That output is English and would pass,
    # which is exactly what makes it dangerous: it costs a run per comment and
    # reads as fine until one of those comments QUOTES an offending body back at
    # the author, at which point the check fails on text it wrote itself and the
    # author cannot clear it.
    #
    # That rule is ALSO in the script, as `isBotSender`, and the script is the
    # authority: no test can read a workflow `if:` expression, so deleting this
    # clause would be silent. The `if:` stays as a cheap filter that avoids
    # spawning a runner; the script is the half under test.
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # `issue_comment: created` fires for ANY user's comment on ANY issue, and
    # the concurrency group keys on the comment id, so parallel comments never
    # coalesce — this is the job an outsider can actually spawn at will. The
    # default timeout is 360 minutes; cap it.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          # Node 24 strips type annotations, so `node scripts/*.ts` runs the
          # TypeScript directly. `run-install: false` because the checker
          # imports nothing outside node: builtins — deliberately, so this
          # workflow cannot be blocked by a lockfile problem.
          node-version: "24"
          cache: false
          run-install: false

      - name: Build the subject document
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          # Server-side fetch, per the header. `--argjson` so a NUMBER that is
          # not a number fails loudly here instead of becoming jq program text.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" \
              | jq --argjson n "$NUMBER" \
                  '{kind:"issue_comment", number:$n, body:.body, labels:[]}' > subject.json
          else
            gh issue view "$NUMBER" -R "$REPO" --json title,body,labels \
              | jq --argjson n "$NUMBER" \
                  '{kind:"issue", number:$n, title:.title, body:.body,
                    labels:[.labels[].name]}' > subject.json
          fi

      - name: Check for non-English text
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          # Passed so the SCRIPT decides what a Bot sender means, not only the
          # `if:` above. Deliberately NOT passed by `english-pr`: that job posts
          # no comment, so there is no loop to break, and skipping a bot-opened
          # PR's body would lose real coverage.
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          set -uo pipefail
          rc=0
          # stderr lands in a FILE and is prefixed after, not left to reach the
          # log raw. It carries only the usage line and a read / parse message
          # today, none of them attacker-derived — but "which stream is safe" is
          # a per-site judgement, and that is the shape that ships a raw echo.
          # One rule for both streams. A file rather than `2> >(sed ...)`:
          # process substitution races the step's own exit, so the prefixed
          # lines can land after the verdict or not at all.
          node scripts/check-gh-body-english.ts subject.json \
            > report.md 2> report.err || rc=$?
          [ -s report.err ] && sed 's/^/| /' report.err >&2
          # Piped through a NON-WHITESPACE prefix before it reaches the log.
          # The runner TRIM-STARTS each line before deciding whether it is a
          # workflow command, so the report's own two-space fence indent
          # protects nothing: an issue body whose first offending line is
          # `::stop-commands::<non-English text>` would suppress every later
          # annotation in this job — and any GitHub user can open an issue. The
          # FILE stays pristine; it is posted as a comment, where the fence has
          # to render.
          sed 's/^/| /' report.md
          [ "$rc" = "0" ] && exit 0
          # rc 2 is "could not evaluate", never "clean". A checker that did not
          # look has not passed, and mapping the two together is the fail-open
          # the retired hook's own load guard existed to prevent.
          [ "$rc" = "1" ] || exit "$rc"
          # Comment only on the CREATING action. On an `edited` event the job
          # still fails, but re-posting the same report on every keystroke-save
          # would be spam; the comment from the original event still stands.
          if [ "$ACTION" = "opened" ] || [ "$ACTION" = "created" ]; then
            gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@report.md --silent
          fi
          exit 1

  # --- English-only, on the PR surface --------------------------------------
  # No write permission, by design: the failing check run IS the output, and it
  # blocks the merge. See the `pull_request` decision in the header.
  english-pr:
    name: English-only (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # SAME-REPO PR -> the head; FORK PR -> the base. The same trust vs
          # bootstrap argument as `pr-content-checks.yml`, and the same residual
          # it does not close (a fork supplies the workflow DEFINITION on a
          # `pull_request` trigger); read both there, it is the authority. This
          # decides only WHICH CHECKER runs — the text under test always comes
          # from the API.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.sha
            || github.event.pull_request.base.sha }}

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1
        with:
          node-version: "24"
          cache: false
          run-install: false

      - name: Check the PR title and body for non-English text
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$NUMBER" -R "$REPO" --json title,body,labels \
            | jq --argjson n "$NUMBER" \
                '{kind:"pull_request", number:$n, title:.title, body:.body,
                  labels:[.labels[].name]}' > subject.json
          # Both streams through a NON-WHITESPACE prefix before they reach the
          # log, for the reason given in `english-issue` above. `pipefail` is
          # set, so the script's exit status still decides the step.
          node scripts/check-gh-body-english.ts subject.json 2>&1 | sed 's/^/| /'
