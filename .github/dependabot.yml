# Dependabot version updates.
#
# Commit-message prefixes are chosen against this repo's release-please
# commit parsing (release-please-config.json): `chore(...)` / `ci(...)` do NOT
# feed a release, which is deliberate — runtime deps use caret ranges, so
# users already pick up newer AWS SDK clients on install; a lockfile/range
# bump only affects dev + CI.
# All prefixes are in pr-title-check.yml's allowed types.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Hold a new release back for 7 days (14 for a major) before proposing it,
    # so a hijacked version is usually yanked before it reaches a PR.
    # Security updates are exempt and still open immediately.
    cooldown:
      default-days: 7
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # The @aws-sdk/client-* deps release in lockstep; one PR, not many.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
      semver-major-days: 14
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
