# markgate configuration — https://github.com/go-to-k/markgate
#
# Eight gates back the pre-commit / pre-PR / pre-merge checks for cdk-local.
# cdk-local does NOT deploy to AWS (no destroy path, no schema migration,
# no broad real-AWS integ matrix), so the destroy / broad / schema-migration
# gates from cdkd are not needed.
#
# After pulling a change to this file OR to `.mise.toml`, run `mise install`.
# An older markgate binary rejects a newer config outright — an unknown
# `hash:` value fails parsing for EVERY gate, not just the one using it —
# and the gate hooks discard markgate's stderr, so the symptom is a
# misleading "run /check first" that re-running `/check` cannot clear.
#
# Gates:
#   check          — typecheck/lint/build/unit tests
#                    (set by /check and /verify-pr).
#   docs           — README/CLAUDE.md/docs consistency with src
#                    (set by /check-docs and /verify-pr).
#   verify-pr      — full PR-readiness checklist (live-test of changed
#                    behavior, shared-utility caller verification, PR
#                    title + body freshness, retrospective). Set ONLY by
#                    /verify-pr. Declared as `requires: [check, docs]`
#                    so freshness is the AND of those children plus the
#                    skill's own work.
#   pr-review      — `/review-pr` reviewer-dispatch verification on
#                    size-flagged PRs. Bound to the PR's HEAD sha via the
#                    `.markgate-pr-review-sha` sentinel file.
#   integ          — Docker-based local-execution verification with zero
#                    orphan containers / networks. Set ONLY by /run-integ
#                    when a `local-*` integ test finishes cleanly AND the
#                    post-run `docker ps` / `docker network ls` sweep is
#                    empty. 14d TTL — Docker base images, RIE binary,
#                    chokidar / network behavior, dockerd semantics drift
#                    over time, so a marker that's been clean for two
#                    weeks no longer proves today's local code path works.
#                    The only gate on `hash: diff` (see its block below).
#   cdkd-parity    — Host-CLI (cdkd) parity review for library-surface
#                    changes (new subcommand factory / new CLI option /
#                    new public helper / behavior change). Set ONLY by
#                    /check-cdkd-parity. Scope is the public library
#                    surface; out-of-scope diffs don't invalidate it.
#   create-integ   — A NEW `src/cli/commands/local-<verb>.ts` factory (a
#                    brand-new subcommand) MUST ship its own integ fixture.
#                    Set ONLY by /create-integ, which scaffolds + RUNS the
#                    new fixture. Pre-create only, like cdkd-parity.
#   merge-pr       — Forces a worktree `gh pr merge` through the /merge-pr
#                    skill. TTL-only (30m), no file hash — see its block
#                    below for why a content digest cannot work here.

gates:
  check:
    hash: files
    include:
      - "src/**"
      - "tests/**"
      # Checker-INPUT files outside src/tests (issue #620): these are files
      # the unit suite READS, so an edit to one can red the suite while a
      # previously-set `check` marker stays FRESH — the marker then attests
      # to a tree the checker's input no longer matches.
      #   - tests/unit/skills/skill-file-payload.test.ts reads every
      #     SKILL.md + references/*.md (byte caps, moved-not-dropped floors)
      #   - tests/unit/skills/work-issues-skill-refs.test.ts reads skills +
      #     agents + rules (bare-ref scan)
      #   - tests/unit/hooks/gate-if-matchers.test.ts reads
      #     .claude/settings.json (the #1801 inert-`if:` class)
      #   - tests/unit/hooks/pr-inherit-issue-labels.test.ts reads its
      #     workflow YAML
      # `.claude/rules/**` sits in `docs` too — same overlap cdkd carries,
      # for the same two reasons. Known limit, deliberate: the repo-wide
      # scanners (e.g. tests/unit/no-control-bytes.test.ts globs every
      # tracked text file) read a population scoping cannot follow without
      # making the marker stale on every edit anywhere; CI remains the
      # backstop there.
      - ".claude/skills/**"
      - ".claude/agents/**"
      - ".claude/rules/**"
      - ".claude/settings.json"
      - ".github/workflows/pr-inherit-issue-labels.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - ".eslintrc*"
      - ".prettierrc*"

  docs:
    hash: files
    include:
      - "src/**"
      - "docs/**"
      - "README.md"
      - ".claude/CLAUDE.md"
      - ".claude/rules/**"

  verify-pr:
    requires: [check, docs]

  pr-review:
    hash: files
    include:
      - ".markgate-pr-review-sha"

  integ:
    # `hash: diff` (markgate 0.4+) digests this branch's delta against
    # `merge-base(origin/main, HEAD)` restricted to the include set below,
    # NOT the working tree's content. So a `main` merge / rebase that moves
    # an in-scope file this branch did NOT touch leaves the marker fresh —
    # that change already passed this same gate in its own PR — while a
    # `main` change to a file this branch ALSO changed still stales it, as
    # does any in-scope edit on this branch (committed or not). Adopted for
    # `integ` only: re-running it costs a Docker fixture run, so the
    # strictness `hash: files` buys is worth trading here. The narrower
    # `cdkd-parity` / `create-integ` gates stay on `hash: files` — both are
    # centred on the small, hot `src/cli/commands/**` directory (cdkd-parity
    # also covers `src/internal.ts` / `src/index.ts`) where half the
    # invalidations are genuine overlaps, so the mode would buy almost
    # nothing; `check` / `docs` stay strict because re-running them is
    # cheap. Measurement + accepted limitation (a caller broken by this
    # branch changing A while `main` changes B is invisible to `hash: diff`,
    # bounded by the TTL below): issue #498.
    #
    # `base` is mandatory for `hash: diff` — there is no `origin/HEAD`
    # fallback, since that ref is frequently unset in CI clones and the gate
    # must mean the same thing locally and in CI.
    hash: diff
    base: origin/main
    # Wall-clock TTL on top of the diff-scope check (markgate 0.3+).
    # Docker base-image behavior (`public.ecr.aws/lambda/*`, RIE binary),
    # `dockerd` semantics, and chokidar / network plumbing drift even
    # when the repo doesn't. 14d matches cdkd's integ-local gate —
    # aggressive enough to catch environment drift, lax enough to avoid
    # forcing a Docker run on every local-touching PR.
    ttl: 14d
    include:
      - "src/**"
      - "tests/integration/**"

  cdkd-parity:
    hash: files
    # Scope is the public library surface that cdkd (and any other host
    # CLI) embeds: the CLI command factories, the unstable internal
    # subpath, and the stable index export list. Edits anywhere else
    # in `src/**` don't invalidate this marker — they don't affect
    # what a host CLI sees.
    include:
      - "src/cli/commands/**"
      - "src/internal.ts"
      - "src/index.ts"

  create-integ:
    hash: files
    # A NEW `src/cli/commands/local-<verb>.ts` factory (a file declaring
    # `createLocal<Verb>Command`) is a brand-new subcommand with NO
    # existing integ fixture, so it MUST ship its own.
    # `create-integ-gate.sh` (pre-create only) fires when the PR adds such
    # a factory file; `/create-integ` scaffolds + RUNS the new fixture and
    # sets this marker. Scope is the whole command-factory surface, which
    # is intentionally BROADER than the gate's trigger: any
    # `src/cli/commands/**` edit stales the marker, but the gate only
    # BLOCKS when a new factory file is also added, so staleness without a
    # new-file add is a no-op. Pre-create-only, like cdkd-parity, so a
    # later edit on the same PR doesn't re-block.
    include:
      - "src/cli/commands/**"

  merge-pr:
    # `gh-pr-merge-worktree-gate.sh` blocks a hand-run `gh pr merge` from a
    # side worktree (`*/.claude/worktrees/*`) unless this marker is fresh —
    # forcing every worktree merge through the `/merge-pr` skill (the single
    # chokepoint that merges WITHOUT `--delete-branch`, so it never trips the
    # `'main' is already used by worktree` fatal, then cleans the worktree +
    # local + remote branch). `/merge-pr` runs `markgate set merge-pr` in its
    # own step BEFORE its `gh pr merge` call so its own merge passes; a
    # hand-run merge has no fresh marker and is blocked.
    #
    # TTL-only (no file-hash): a merge does not change tracked files, so a
    # content digest would stay "fresh" indefinitely after `/merge-pr` set
    # it. The short TTL bounds the window so a stale marker left by a crashed
    # `/merge-pr` cannot authorize a later hand-run merge (re-run `/merge-pr`,
    # which re-sets it). 30m comfortably covers a merge + cleanup pass.
    ttl: 30m
