# markgate configuration — https://github.com/go-to-k/markgate
#
# ONE gate backs the pre-merge check for cdk-local. Everything else `/check`,
# `/check-docs`, `/verify-pr` and `/review-pr` do is recommended procedure and
# is enforced by nothing (see `.claude/AGENTS.md`, "Tooling Policy").
#
# After pulling a change to this file OR to `.mise.toml`, run `mise install`.
# An older markgate binary rejects a newer config outright — an unknown
# `hash:` value fails parsing for EVERY gate, not just the one using it —
# and the gate hook discards markgate's stderr, so the symptom is a misleading
# staleness message that re-running the skill cannot clear.
#
# Gate:
#   integ — a clean `/run-integ` run. Set ONLY by /run-integ, and only when the
#           fixture finished cleanly AND its sweeps came back empty: the
#           post-run `docker ps` / `docker network ls` sweep for every fixture,
#           plus the AWS orphan sweep for the `*-from-cfn-stack` fixtures, which
#           deploy real CloudFormation stacks with the upstream CDK CLI. That
#           second half is why this gate survives the criterion: a leaked stack
#           bills the maintainer's AWS account and reverting the PR does not
#           take it back. 14d TTL — Docker base images, the RIE binary,
#           chokidar / network behavior and dockerd semantics drift over time,
#           so a marker clean for two weeks no longer proves today's code path
#           works.

gates:
  integ:
    # `hash: diff` (markgate 0.4+) digests this branch's delta against
    # `merge-base(origin/main, HEAD)` restricted to the include set below,
    # NOT the working tree's content. So a `main` merge / rebase that moves
    # an in-scope file this branch did NOT touch leaves the marker fresh —
    # that change already passed this same gate in its own PR — while a
    # `main` change to a file this branch ALSO changed still stales it, as
    # does any in-scope edit on this branch (committed or not). Re-running
    # this gate costs a Docker fixture run, so the strictness `hash: files`
    # buys is worth trading here. Accepted limitation (a caller broken by this
    # branch changing A while `main` changes B is invisible to `hash: diff`,
    # bounded by the TTL below): issue #498.
    #
    # `base` is mandatory for `hash: diff` — there is no `origin/HEAD`
    # fallback, since that ref is frequently unset in CI clones and the gate
    # must mean the same thing locally and in CI.
    hash: diff
    base: origin/main
    ttl: 14d
    include:
      - "src/**"
      - "tests/integration/**"
